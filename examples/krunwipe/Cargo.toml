[package]
name = "krunwipe"
version = "0.1.0"
edition = "2024"
description = "Run a Python script or an OCI container in a libkrun microVM whose RAM is tagged for wiping on kdump"
license = "Apache-2.0"
build = "build.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
krun-init = { package = "krun-init-blob", path = "../../init/init-blob" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
pkg-config = "0.3"
